# Tutorial work. Every name, place, domain and number here is fictional.
schemaVersion: 1
slug: quiet-frequency
title: The Quiet Frequency
status: published
creator: deepdive-team
blurb: A friendly archivist needs help finding a time capsule left by a small-town radio club. A gentle first game.
description: |
  Iris, the archivist at the Halden Public Library, has found a mystery in the basement: a locked
  time capsule left by an old amateur radio club. Help her dig through the library's website, a local
  newspaper and a scanned newsletter to open it.

  This is the DeepDive tutorial. You will learn to use the in-game browser, the search engine, mail,
  files, notes and answer checks. No prior experience needed.
genres: [tutorial, mystery]
playTimeMinutes: { min: 20, max: 30 }
difficulty: beginner
