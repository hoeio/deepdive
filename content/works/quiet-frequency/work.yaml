    kind: image
    asset: images/cornerstone.svg
    alt: "A weathered stone block engraved with the words HALDEN PUBLIC LIBRARY and the Roman numerals MCMXXIII."
    body: The cornerstone beside the front steps.
    keywords: [stone, photo, inscription]

  - id: visitor-guide
    title: Visitor guide (PDF)
    kind: pdf
    asset: docs/visitor-guide.pdf
    body: Opening hours, floor plan notes and library rules.
    keywords: [guide, pdf, rules]

  - id: newsletter
    title: "Radio Circle newsletter (scan)"
    kind: image
    asset: images/newsletter.svg
    alt: "A one-page newsletter titled The Circle Times with seven headings: Listening Hours, Antenna Repairs, New Members, Tuesday Meetups, Equipment Swap, Radio Etiquette, Notes from Wren."
    keywords: [newsletter, circle times, code word]
    body: |
      **Transcript.** *The Circle Times*. A note at the top reads: "Members, our code word hides in plain
      sight. Read down the first letters of this issue's headings."

      1. Listening Hours
      2. Antenna Repairs
      3. New Members
      4. Tuesday Meetups
      5. Equipment Swap
      6. Radio Etiquette
      7. Notes from Wren

  - id: wren-letter
    title: A letter from Wren Talbot
    kind: text
    keywords: [letter, wren, capsule]
    body: |
      To whoever opens this box,

      We built radios in this basement for many happy years. We never needed the fastest equipment,
      only patience and good company. If you found this, you have both.

      Keep listening.

      Wren Talbot, Halden Radio Circle

puzzles:
  - id: founder
    title: Who founded the club?
    prompt: Iris wants to know who founded the old radio club. Enter their full name.
    answerHashes: [sha256:d69cf03f41f4de191d2563e25625a3d7abe407d5bcd15b8b309627aca308aecf]
    hints:
      direction: The library's homepage doesn't link to the club's page. The search engine can find it.
      where: In the Browser, go to Seek and search for "radio circle". Open the local history page.
      answer: Wren Talbot.

  - id: code-word
    title: The club's code word
    prompt: The members hid a code word in their newsletter. What is it?
    answerHashes: [sha256:05802ee846d5c01f31d27aa0584995edafac693663f0f70a3c057aaba0b76997]
    hints:
      direction: The newsletter Iris sent you holds the code word "in plain sight".
      where: Open the newsletter in Files and read the first letter of each heading, top to bottom.
      answer: LANTERN.

  - id: capsule-code
    title: Open the time capsule
    prompt: The capsule's keypad takes four digits. What is the code?
    answerHashes: [sha256:ad378672792b4f9e003921aa8266d09343d4f6224a907b33bf3537a06bc8f4f8]
    hints:
      direction: The code is a year. Wren's note says to "ask the stone".
      where: The About page links to a photo of the cornerstone. The year is written in Roman numerals.
      answer: 1923 (MCMXXIII on the cornerstone).

gates:
  - id: after-founder
    when: { solved: [founder] }
    unlocks:
      mails: [mail-newsletter]
      documents: [newsletter]
      puzzles: [code-word]
      search: [radio-circle-members]
  - id: after-code-word
    when: { solved: [code-word] }
    unlocks:
      pages: [basement]
      mails: [mail-door]
      puzzles: [capsule-code]
  - id: after-capsule
    when: { solved: [capsule-code] }
    unlocks:
      mails: [mail-thanks]
      documents: [wren-letter]

ending:
  requires: [capsule-code]
  title: Keep listening
  body: |
    The lid opens with a soft click. Inside are a few hand-built radio parts, a photo of smiling club members
    and a letter from Wren Talbot.

    Iris holds the photo up to the light. "They'd be glad someone was still listening," she says.

    **Thank you for playing The Quiet Frequency.** You can read [Wren's letter](doc:wren-letter) in Files.
