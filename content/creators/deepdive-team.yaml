id: deepdive-team
name: DeepDive Team
bio: |
  We build the DeepDive platform and write its first games. Our works are short, original and
  designed to teach the virtual internet: browsing, searching, reading mail and solving puzzles.
warningPolicy: |
  Every work declares all four required content warnings, even when the answer is "none".
  Notes describe what is present, never when or how it happens, so warnings never spoil the story.
broadcastPolicy: |
  Our works may be streamed and recorded unless a work says otherwise. Please keep puzzle answers
  out of titles and thumbnails so viewers can play too.
