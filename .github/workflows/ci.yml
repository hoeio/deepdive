name: CI
on:
  push:
  pull_request:

jobs:
  check:
    # Pinned: Playwright --with-deps does not support Ubuntu 26 (ubuntu-latest since Oct 2026) yet.
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: file:./ci.db
      PROOF_SECRET: ci-only-secret
      DEEPDIVE_FIXTURES: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx prisma db push --skip-generate
      - name: Install Playwright browser
        shell: bash
        run: |
          set -o pipefail
          if ! npx playwright install --with-deps chromium 2>&1 | tee pw-install.log; then
            # Surface the tail of the log as an annotation (readable without opening the job log).
            echo "::error title=playwright install::$(tail -25 pw-install.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi
      - run: npm run build
      - run: npm run e2e
      - run: npm run a11y
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
