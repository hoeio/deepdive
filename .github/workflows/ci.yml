name: CI
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # Browsers and their system libraries come preinstalled, so CI never depends on apt mirrors.
    # Keep the tag in sync with @playwright/test in package.json.
    container: mcr.microsoft.com/playwright:v1.65.0-noble
    env:
      DATABASE_URL: file:./ci.db
      PROOF_SECRET: ci-only-secret
      DEEPDIVE_FIXTURES: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx prisma db push --skip-generate
      - run: npm run build
      - run: npm run e2e
      - run: npm run a11y
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
